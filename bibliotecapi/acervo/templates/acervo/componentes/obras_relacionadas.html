<section class="panel"><h2>Livros relacionados</h2><div class="table-wrap"><table><thead><tr><th>Título</th><th>Autoria</th></tr></thead><tbody>{% for livro in livros %}<tr><td><a href="{{ livro.get_absolute_url }}">{{ livro.titulo }}</a></td><td>{{ livro.autor|default:'Não informada' }}</td></tr>{% empty %}<tr><td colspan="2">Nenhum livro vinculado a este cadastro. Consulte o catálogo para encontrar outras leituras.</td></tr>{% endfor %}</tbody></table></div></section>
